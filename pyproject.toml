[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "association-hybrid-data-platform"
version = "0.1.0"
description = "API de suivi associatif avec séparation des données privées et des activités"
authors = [{ name = "Nassir Chaabani" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "PyJWT>=2.9,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "email-validator>=2.2,<3.0",
]

[project.urls]
Repository = "https://github.com/nassirchaabani/hybrid-data-platform"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pip-audit>=2.9,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.7,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=85"
markers = [
  "integration: nécessite deux instances PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
